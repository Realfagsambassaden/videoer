<script>
const KART=/*KART*/[], TEMPO=/*TEMPO*/1;
const LENGDE=/*LENGDE*/300;
// kildetid → videotid
function M(T){for(const [a,b,c,d] of KART){if(T<c)return a/TEMPO;if(T<=d)return (a+(T-c))/TEMPO;}return LENGDE;}
window.S=[['hele',LENGDE]];
const C=document.getElementById('c'),g=C.getContext('2d');
const KRITT='#ecefe6',GRONN='#6ef04a',ORANSJE='#f19c2c',GUL='#eee462',TURKIS='#56d7b8',ROD='#e0573d',GRA='#7d8781',LILLA='#b48cff';
const F='AD';
let T=0; // kildetid nå
const kl=x=>Math.max(0,Math.min(1,x)), ease=x=>{x=kl(x);return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2};
// p(t0,d): fremdrift fra kildetid t0 over d sekunder (i videotid)
const p=(t0,d=0.6)=>kl((M(T)-M(t0))/d*1);
const pv=(t0,d)=>kl((tv-M(t0))/d);
let tv=0; // videotid nå
// synlighet: inn ved t0, ut ved t1 (kildetider)
function vis(t0,t1){const a=kl((tv-M(t0)+0.0)/0.35);const b=t1==null?1:kl((M(t1)-tv)/0.4);return Math.min(a,b);}
function pop(t0){const x=(tv-M(t0))/0.35;if(x<0)return 0;if(x>1)return 1;return 1+0.25*Math.sin(Math.PI*x)*(1-x)+ (x<0.3? -0.3*(1-x/0.3):0);}

// ---- tekst med enkel matte-markup: a_{xx}, a^{2}
function tokens(s){const out=[];let i=0;while(i<s.length){const ch=s[i];if((ch==='_'||ch==='^')&&i+1<s.length){let j=i+1,inner;if(s[j]==='{'){const k=s.indexOf('}',j);inner=s.slice(j+1,k);i=k+1}else{inner=s[j];i=j+1}out.push([ch==='_'?'sub':'sup',inner])}else{let j=i;while(j<s.length&&s[j]!=='_'&&s[j]!=='^')j++;out.push(['n',s.slice(i,j)]);i=j}}return out}
function maal(s,sz){let w=0;for(const [k,v] of tokens(s)){g.font=`${k==='n'?sz:sz*0.62}px ${F}`;w+=g.measureText(v).width}return w}
// skriv tekst; skriv = fremdrift 0..1 (skrives fram fra venstre)
function tx(s,x,y,sz,col,alpha=1,skriv=1,align='left'){if(alpha<=0||skriv<=0)return 0;const w=maal(s,sz);if(align==='center')x-=w/2;if(align==='right')x-=w;
 g.save();g.globalAlpha*=alpha;if(skriv<1){g.beginPath();g.rect(x-10,y-sz*1.3,(w+20)*skriv,sz*2.2);g.clip()}
 g.fillStyle=col;g.textBaseline='alphabetic';let cx=x;for(const [k,v] of tokens(s)){const f=k==='n'?sz:sz*0.62;g.font=`${f}px ${F}`;const dy=k==='sub'?sz*0.28:k==='sup'?-sz*0.42:0;g.fillText(v,cx,y+dy);cx+=g.measureText(v).width}
 g.restore();return w}
// tekst som skrives fram når den sies
function txt(s,x,y,sz,col,t0,t1,dur=0.9,align='left'){const a=vis(t0,t1);if(a<=0)return;tx(s,x,y,sz,col,a,pv(t0,dur),align)}
// ligning satt sammen av deler: [[tekst,farge,alpha]], returnerer x-posisjoner
function likn(deler,x,y,sz,alpha=1,skriv=1){let cx=x;const pos=[];const tot=deler.reduce((s,d)=>s+maal(d[0],sz),0);let brukt=0;
 for(const d of deler){const w=maal(d[0],sz);const lok=kl((skriv*tot-brukt)/w);pos.push([cx,w]);tx(d[0],cx,y,sz,d[1],alpha*(d[2]??1),lok);cx+=w;brukt+=w}return pos}
// lapp: liten merkelapp med strek under
function lapp(s,x,y,col,t0,t1,sz=34){const a=vis(t0,t1);if(a<=0)return;const w=tx(s,x,y,sz,col,a,pv(t0,0.7));g.save();g.globalAlpha=a;g.strokeStyle=col;g.lineWidth=3;g.lineCap='round';g.beginPath();g.moveTo(x,y+12);g.lineTo(x+w*ease(pv(t0+0.2,0.6)),y+12);g.stroke();g.restore()}
function boks(x,y,w,h,col,alpha,glod=true){if(alpha<=0)return;g.save();g.globalAlpha=alpha;g.strokeStyle=col;g.lineWidth=4;if(glod){g.shadowColor=col;g.shadowBlur=18}rr(x,y,w,h,16);g.stroke();g.restore()}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function strek(x1,y1,x2,y2,col,lw,fr=1,alpha=1){if(fr<=0||alpha<=0)return;g.save();g.globalAlpha=alpha;g.strokeStyle=col;g.lineWidth=lw;g.lineCap='round';g.beginPath();g.moveTo(x1,y1);g.lineTo(x1+(x2-x1)*fr,y1+(y2-y1)*fr);g.stroke();g.restore()}
function pil(x1,y1,x2,y2,col,lw,fr=1,alpha=1,hode=18){if(fr<=0||alpha<=0)return;const ex=x1+(x2-x1)*fr,ey=y1+(y2-y1)*fr;strek(x1,y1,ex,ey,col,lw,1,alpha);const a=Math.atan2(ey-y1,ex-x1);g.save();g.globalAlpha=alpha;g.fillStyle=col;g.beginPath();g.moveTo(ex+Math.cos(a)*4,ey+Math.sin(a)*4);g.lineTo(ex-hode*Math.cos(a-0.45),ey-hode*Math.sin(a-0.45));g.lineTo(ex-hode*Math.cos(a+0.45),ey-hode*Math.sin(a+0.45));g.closePath();g.fill();g.restore()}
function stempel(s,x,y,col,t0,t1,sz=34){const a=vis(t0,t1);if(a<=0)return;const sc=pop(t0);g.save();g.translate(x,y);g.rotate(-0.06);g.scale(sc,sc);g.globalAlpha=a;g.font=`${sz}px Mont`;g.font=`900 ${sz}px Mont`;const w=g.measureText(s).width;g.strokeStyle=col;g.lineWidth=4;g.shadowColor=col;g.shadowBlur=12;rr(-w/2-18,-sz*0.95,w+36,sz*1.45,10);g.stroke();g.shadowBlur=0;g.fillStyle=col;g.textAlign='center';g.fillText(s,0,sz*0.18);g.restore()}
function matrise(rader,x,y,sz,col,alpha,cw=110,rh=null){if(alpha<=0)return;rh=rh||sz*1.25;const n=rader.length,m=rader[0].length;const W=cw*m,H=rh*n;g.save();g.globalAlpha=alpha;g.strokeStyle=col;g.lineWidth=3.5;g.lineCap='round';
 g.beginPath();g.moveTo(x+14,y-sz);g.lineTo(x,y-sz);g.lineTo(x,y-sz+H+10);g.lineTo(x+14,y-sz+H+10);g.stroke();g.beginPath();g.moveTo(x+W+16,y-sz);g.lineTo(x+W+30,y-sz);g.lineTo(x+W+30,y-sz+H+10);g.lineTo(x+W+16,y-sz+H+10);g.stroke();g.restore();
 for(let i=0;i<n;i++)for(let j=0;j<m;j++){const c=rader[i][j];if(c==null)continue;const [s,cc,aa]=Array.isArray(c)?c:[c,col,1];tx(s,x+15+cw*j+cw/2,y+i*rh+rh*0.12,sz,cc,alpha*(aa??1),1,'center')}}

// ---- kartet øverst til venstre
function kart(lys,alpha){if(alpha<=0)return;const noder=[['PDE',60],['type',190],['betingelser',330]];g.save();g.globalAlpha=alpha*0.9;
 for(let i=0;i<noder.length;i++){const [s,x]=noder[i];const on=s===lys;g.font=`28px ${F}`;const w=g.measureText(s).width;g.globalAlpha=alpha*(on?1:0.38);g.strokeStyle=on?ORANSJE:GRA;g.lineWidth=on?3:2;if(on){g.shadowColor=ORANSJE;g.shadowBlur=12}rr(x,34,w+24,44,10);g.stroke();g.shadowBlur=0;g.fillStyle=on?ORANSJE:KRITT;g.fillText(s,x+12,65);
  if(i<noder.length-1){g.globalAlpha=alpha*0.38;pil(x+w+30,56,noder[i+1][1]-6,56,GRA,2,1,1,9)}}g.restore()}

// ---- små pilpar for egenverdier
function pilpar(x,y,type,alpha,sk=1){if(alpha<=0)return;const L=48*sk;const a1=-0.5;
 pil(x,y,x+L*Math.cos(a1),y+L*Math.sin(a1),GRONN,4,1,alpha,11);
 if(type==='like')pil(x,y,x+L*Math.cos(a1+Math.PI/2)*0.75,y+L*Math.sin(a1+Math.PI/2)*0.75,GRONN,4,1,alpha,11);
 if(type==='null'){g.save();g.globalAlpha=alpha;g.fillStyle=KRITT;g.beginPath();g.arc(x,y,5,0,7);g.fill();g.restore()}
 if(type==='mot')pil(x,y,x+L*Math.cos(a1+Math.PI/2)*0.75,y+L*Math.sin(a1+Math.PI/2)*0.75,ROD,4,1,alpha,11)}

// ---- fargeskala kald→varm
function varmefarge(v){v=kl(v);const r=Math.round(40+215*v),gg=Math.round(90+60*Math.sin(Math.PI*v)),b=Math.round(230-200*v);return `rgb(${r},${gg},${b})`}
// stasjonær plate med varm venstrekant (Laplace), forhåndsberegnet
const PLATE=(()=>{const N=40,u=[];for(let i=0;i<N;i++){u.push([]);for(let j=0;j<N;j++){const x=(j+0.5)/N,y=(i+0.5)/N;let s=0;for(let k=1;k<40;k+=2)s+=4/(Math.PI*k)*Math.sin(k*Math.PI*y)*Math.sinh(k*Math.PI*(1-x))/Math.sinh(k*Math.PI);u[i].push(s)}}return u})();

// ================= SIDENE =================
function side1(){ // 228.9–396: andre orden, generell form, matrise, rotasjon
 const ut=396.0; if(tv>M(ut)+0.5)return;
 kart('type',vis(228.9,ut));
 // tittel
 txt('Tre typer PDE-er',60,150,64,ORANSJE,228.9,300.0,1.0);
 // F-boks som viser hvilke deriverte som teller
 { const a=vis(228.95,300.0); if(a>0){ const hl=ease(pv(231.0,0.6)); const x=80,y=290,sz=58;
   const deler=[['F( x, t, ',KRITT],['u',KRITT,1-0.6*hl],[', ',KRITT],['u_{t}',KRITT,1-0.6*hl],[', ',KRITT],['u_{x}',KRITT,1-0.6*hl],[', ',KRITT],['u_{xx}',hl>0.5?GUL:KRITT],[', … ) = 0',KRITT]];
   const pos=likn(deler,x+30,y,sz,a,1); boks(x,y-80,pos[pos.length-1][0]+pos[pos.length-1][1]-x+30,120,GRONN,a);
   lapp('andre orden: den høyeste deriverte er en andrederivert',80,420,GUL,235.16,300.0,36);
   lapp('de høyeste deriverte bestemmer hvordan løsningen oppfører seg',80,490,GUL,248.4,300.0,36);
 }}
 // generell form
 const eqA=vis(300.05,ut); const y0=230, sz0=62;
 if(eqA>0){
   const lav=ease(pv(323.9,0.6)); const stryk=ease(pv(375.82,0.8)); const nyform=ease(pv(381.62,0.6));
   const del=[['u_{xx}',GUL],[' + ',KRITT],['a',GUL],['·u_{xy}',GUL],[' + ',KRITT],['b',GUL],['·u_{yy}',GUL],[' = ',KRITT],['(lavere orden)',KRITT,1-0.6*lav]];
   const hlK=ease(pv(333.6,0.5))*(1-ease(pv(346,0.5)));
   if(hlK>0){del[2][1]=TURKIS;del[5][1]=TURKIS}
   const pos=likn(del,80,y0,sz0,eqA*(1-0.45*nyform),pv(300.05,4.5));
   // a og b kan være funksjoner
   lapp('a og b: tall eller funksjoner a(x, y), b(x, y)',80,y0+70,GRA,310.9,323.9,32);
   lapp('bare andreordensleddene bestemmer typen',80,y0+70,GUL,323.9,342.0,34);
   // stryk a·u_xy
   if(stryk>0){const [xa]=pos[2];const [xb,wb]=pos[3];strek(xa-6,y0-18,xa-6+(xb+wb-xa+12)*stryk,y0-18,ROD,6,1,eqA)}
   // ny form
   if(nyform>0) likn([['λ_{1}',GRONN],['·u_{ξξ}',GUL],[' + ',KRITT],['λ_{2}',GRONN],['·u_{ηη}',GUL],[' + … = 0',KRITT]],80,y0+95,sz0,eqA*nyform,pv(381.62,3.5));
 }
 // matrisen A
 const mA=vis(342.0,ut); if(mA>0){
   const fly=ease(pv(342.0,1.0)); const diag=ease(pv(377.0,0.8));
   const x=110,y=520; tx('A =',x-10,y+40,56,KRITT,mA,1);
   const rad=[[['1',KRITT],[diag>0.5?'0':'a/2',diag>0.5?GRA:TURKIS]],[[diag>0.5?'0':'a/2',diag>0.5?GRA:TURKIS],['b',TURKIS]]];
   if(diag>0.5){rad[0][0]=['λ_{1}',GRONN];rad[1][1]=['λ_{2}',GRONN]}
   g.save();g.translate(0,(1-fly)*(-260));matrise(rad,x+100,y,52,KRITT,mA*fly,120);g.restore();
   tx('symmetrisk',x+105,y+175,30,GRA,mA*pv(344.3,0.6),pv(344.3,0.8));
   // Hessematrisen, grå
   const h=vis(349.06,361.0); if(h>0){ matrise([['u_{xx}','u_{xy}'],['u_{xy}','u_{yy}']],470,y,40,GRA,h,105);
     tx('A virker på de andrederiverte',440,y+175,30,GRA,h,pv(350.4,1.2)); }
 }
 // rotasjon av koordinatsystemet
 const kA=vis(361.04,ut); if(kA>0){
   const cx=880,cy=640,R=250; const th=0.52*ease(pv(367.6,3.6));
   g.save();g.globalAlpha=kA;g.beginPath();g.arc(cx,cy,R+20,0,7);g.clip();
   g.translate(cx,cy);g.rotate(-th);g.strokeStyle='rgba(236,239,230,0.13)';g.lineWidth=1.5;
   for(let k=-6;k<=6;k++){g.beginPath();g.moveTo(k*45,-R-30);g.lineTo(k*45,R+30);g.stroke();g.beginPath();g.moveTo(-R-30,k*45);g.lineTo(R+30,k*45);g.stroke()}
   g.restore();
   // akser
   const ax=(v)=>[cx+R*Math.cos(v),cy-R*Math.sin(v)];
   const [x1,y1]=ax(th),[x2,y2]=ax(th+Math.PI/2);
   pil(cx-(x1-cx),cy-(y1-cy),x1,y1,KRITT,3,1,kA,14);pil(cx-(x2-cx),cy-(y2-cy),x2,y2,KRITT,3,1,kA,14);
   const nyNavn=ease(pv(371.0,0.6));
   tx('x',x1+10,y1+8,40,KRITT,kA*(1-nyNavn));tx('y',x2+10,y2+8,40,KRITT,kA*(1-nyNavn));
   tx('ξ',x1+10,y1+8,44,ORANSJE,kA*nyNavn);tx('η',x2+10,y2+8,44,ORANSJE,kA*nyNavn);
   // egenvektorer
   const ev=ease(pv(369.0,0.8)),th0=0.52;
   pil(cx,cy,cx+170*Math.cos(th0),cy-170*Math.sin(th0),GRONN,6,ev,kA,20);
   pil(cx,cy,cx+120*Math.cos(th0+Math.PI/2),cy-120*Math.sin(th0+Math.PI/2),GRONN,6,ev,kA,20);
   tx('egenvektorer til A',cx-R+10,cy+R+60,32,GRONN,kA*ev,pv(369.2,0.8));
   lapp('dreie langs egenvektorene',640,410,ORANSJE,367.08,375.8,32);
   lapp('blandingsleddet forsvinner',640,410,ROD,375.82,ut,32);
 }
}

function familieboks(i){return [60+i*405,170,385,610]}
function side2(){ // 396.3–595: tre muligheter og informasjon
 const inn=396.3,ut=595.2; if(tv<M(inn)-0.1||tv>M(ut)+0.5)return;
 kart('type',vis(inn,ut));
 const fam=[
  {t0:401.2,type:'like',form:'u_{ξξ} + u_{ηη} = 0',navn:'Laplace',navnT:408.64,ekstra:'Poisson: … = f',ekstraT:414.0,col:KRITT,stemp:'LIKEVEKT · 0 retninger',stempT:563.8,typenavn:'elliptisk',typeT:582.04},
  {t0:432.48,type:'null',form:'u_{ξξ} − u_{η} = 0',navn:'varme',navnT:439.02,col:ROD,stemp:'JEVNER UT · 1 retning',stempT:538.2,typenavn:'parabolsk',typeT:549.08},
  {t0:442.52,type:'mot',form:'u_{ξξ} − u_{ηη} = 0',navn:'bølge',navnT:448.36,col:LILLA,stemp:'FRAKTER · 2 retninger',stempT:511.8,typenavn:'hyperbolsk',typeT:524.4}];
 txt('Tre muligheter for egenverdiene',60,140,46,ORANSJE,396.3,ut,1.2);
 for(let i=0;i<3;i++){const f=fam[i];const [x,y,w,h]=familieboks(i);const a=vis(f.t0,ut);if(a<=0)continue;const sc=pop(f.t0);
  g.save();g.translate(x+w/2,y+h/2);g.scale(sc,sc);g.translate(-x-w/2,-y-h/2);
  boks(x,y,w,h,f.col,a*0.8,false);
  pilpar(x+52,y+80,f.type,a,1.1);
  tx({like:'like fortegn',null:'én er null',mot:'motsatte fortegn'}[f.type],x+110,y+78,30,KRITT,a,pv(f.t0,0.7));
  tx(f.form,x+w/2,y+160,40,GUL,a,pv(f.t0+0.6,1.0),'center');
  tx(f.navn,x+w/2,y+230,50,f.col===KRITT?KRITT:f.col,vis(f.navnT,ut),pv(f.navnT,0.6),'center');
  if(f.ekstra)tx(f.ekstra,x+w/2,y+275,30,GRA,vis(f.ekstraT,ut),pv(f.ekstraT,0.6),'center');
  g.restore();
  // animasjonsfelt
  const ax=x+20,ay=y+300,aw=w-40,ah=h-320;
  if(i===2)bolgeanim(ax,ay,aw,ah,vis(509.34,ut));
  if(i===1)varmeanim(ax,ay,aw,ah,vis(527.8,ut));
  if(i===0)laplaceanim(ax,ay,aw,ah,vis(551.62,ut));
  stempel(f.stemp,x+w/2,y+h+70,f.col===KRITT?GRONN:f.col,f.stempT,ut,26);
  // typenavn
  const tn=vis(f.typeT,ut); if(tn>0){tx(f.typenavn,x+w/2,y+h+150,46,ORANSJE,tn,pv(f.typeT,0.6),'center')}
 }
 lapp('forskjellen: hvordan informasjon beveger seg',60,1040,GUL,480.6,ut,34);
}
function bolgeanim(x,y,w,h,a){if(a<=0)return;const per=3.2;const t=((tv-M(509.34))%per+per)%per;const c=w/2/per*0.9;
 g.save();g.globalAlpha=a;g.strokeStyle='rgba(236,239,230,0.25)';g.lineWidth=2;g.strokeRect(x,y,w,h*0.55);
 tx('t',x+8,y+30,26,GRA,a);tx('x',x+w-24,y+h*0.55-8,26,GRA,a);
 const ox=x+w/2,oy=y+h*0.55; const fr=t/per;
 strek(ox,oy,ox-w*0.45*fr,oy-h*0.5*fr,LILLA,5,1,a);strek(ox,oy,ox+w*0.45*fr,oy-h*0.5*fr,LILLA,5,1,a);
 g.fillStyle=GUL;g.shadowColor=GUL;g.shadowBlur=14;g.beginPath();g.arc(ox,oy,8,0,7);g.fill();g.shadowBlur=0;
 // streng
 const sy=y+h*0.85;g.strokeStyle=LILLA;g.lineWidth=4;g.beginPath();for(let k=0;k<=80;k++){const xx=-1+2*k/80;const s=t*0.55;const u=0.5*(Math.exp(-Math.pow((xx-s)/0.12,2))+Math.exp(-Math.pow((xx+s)/0.12,2)));const X=x+w/2+xx*w/2*0.95,Y=sy-u*70;k?g.lineTo(X,Y):g.moveTo(X,Y)}g.stroke();g.restore()}
function varmeanim(x,y,w,h,a){if(a<=0)return;const per=3.6;const t=((tv-M(527.8))%per+per)%per;
