 for(const q of pts){const n=Math.max(2,Math.round(q.length*fk));g.beginPath();for(let i=0;i<n;i++){const [x,y]=P(...q[i]);i?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}
