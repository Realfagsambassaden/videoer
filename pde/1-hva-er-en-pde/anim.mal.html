<script>
const KART=/*KART*/[], TEMPO=/*TEMPO*/1;
const LENGDE=/*LENGDE*/300;
// kildetid → videotid
function M(T){for(const [a,b,c,d] of KART){if(T<c)return a/TEMPO;if(T<=d)return (a+(T-c))/TEMPO;}return LENGDE;}
window.S=[['hele',LENGDE]];
const C=document.getElementById('c'),g=C.getContext('2d');
const KRITT='#ecefe6',GRONN='#6ef04a',ORANSJE='#f19c2c',GUL='#eee462',TURKIS='#56d7b8',ROD='#e0573d',GRA='#b3bdb6',LILLA='#b48cff';
const F='AD';
let T=0; // kildetid nå
const kl=x=>Math.max(0,Math.min(1,x)), ease=x=>{x=kl(x);return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2};
// p(t0,d): fremdrift fra kildetid t0 over d sekunder (i videotid)
const p=(t0,d=0.6)=>kl((M(T)-M(t0))/d*1);
const pv=(t0,d)=>kl((tv-M(t0))/d);
let tv=0; // videotid nå
// synlighet: inn ved t0, ut ved t1 (kildetider)
function vis(t0,t1){const a=kl((tv-M(t0)+0.0)/0.35);const b=t1==null?1:kl((M(t1)-tv)/0.4);return Math.min(a,b);}
function pop(t0){const x=(tv-M(t0))/0.35;if(x<0)return 0;if(x>1)return 1;return 1+0.25*Math.sin(Math.PI*x)*(1-x)+ (x<0.3? -0.3*(1-x/0.3):0);}

// ---- tekst med enkel matte-markup: a_{xx}, a^{2}
function tokens(s){const out=[];let i=0;while(i<s.length){const ch=s[i];if((ch==='_'||ch==='^')&&i+1<s.length){let j=i+1,inner;if(s[j]==='{'){const k=s.indexOf('}',j);inner=s.slice(j+1,k);i=k+1}else{inner=s[j];i=j+1}out.push([ch==='_'?'sub':'sup',inner])}else{let j=i;while(j<s.length&&s[j]!=='_'&&s[j]!=='^')j++;out.push(['n',s.slice(i,j)]);i=j}}return out}
function maal(s,sz){let w=0;for(const [k,v] of tokens(s)){g.font=`${k==='n'?sz:sz*0.62}px ${F}`;w+=g.measureText(v).width}return w}
// skriv tekst; skriv = fremdrift 0..1 (skrives fram fra venstre)
function tx(s,x,y,sz,col,alpha=1,skriv=1,align='left'){if(alpha<=0||skriv<=0)return 0;const w=maal(s,sz);if(align==='center')x-=w/2;if(align==='right')x-=w;
 g.save();g.globalAlpha*=alpha;if(skriv<1){g.beginPath();g.rect(x-10,y-sz*1.3,(w+20)*skriv,sz*2.2);g.clip()}
 g.fillStyle=col;g.textBaseline='alphabetic';let cx=x;for(const [k,v] of tokens(s)){const f=k==='n'?sz:sz*0.62;g.font=`${f}px ${F}`;const dy=k==='sub'?sz*0.28:k==='sup'?-sz*0.42:0;g.fillText(v,cx,y+dy);cx+=g.measureText(v).width}
 g.restore();return w}
// tekst som skrives fram når den sies
function txt(s,x,y,sz,col,t0,t1,dur=0.9,align='left'){const a=vis(t0,t1);if(a<=0)return;tx(s,x,y,sz,col,a,pv(t0,dur),align)}
// ligning satt sammen av deler: [[tekst,farge,alpha]], returnerer x-posisjoner
function likn(deler,x,y,sz,alpha=1,skriv=1){let cx=x;const pos=[];const tot=deler.reduce((s,d)=>s+maal(d[0],sz),0);let brukt=0;
 for(const d of deler){const w=maal(d[0],sz);const lok=kl((skriv*tot-brukt)/w);pos.push([cx,w]);tx(d[0],cx,y,sz,d[1],alpha*(d[2]??1),lok);cx+=w;brukt+=w}return pos}
// lapp: liten merkelapp med strek under
function lapp(s,x,y,col,t0,t1,sz=34){const a=vis(t0,t1);if(a<=0)return;tx(s,x,y,Math.max(sz,36),col,a,pv(t0,0.7))}
function boks(x,y,w,h,col,alpha,glod=true){if(alpha<=0)return;g.save();g.globalAlpha=alpha;g.strokeStyle=col;g.lineWidth=4;if(glod){g.shadowColor=col;g.shadowBlur=18}rr(x,y,w,h,16);g.stroke();g.restore()}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function strek(x1,y1,x2,y2,col,lw,fr=1,alpha=1){if(fr<=0||alpha<=0)return;g.save();g.globalAlpha=alpha;g.strokeStyle=col;g.lineWidth=lw;g.lineCap='round';g.beginPath();g.moveTo(x1,y1);g.lineTo(x1+(x2-x1)*fr,y1+(y2-y1)*fr);g.stroke();g.restore()}
function pil(x1,y1,x2,y2,col,lw,fr=1,alpha=1,hode=18){if(fr<=0||alpha<=0)return;const ex=x1+(x2-x1)*fr,ey=y1+(y2-y1)*fr;strek(x1,y1,ex,ey,col,lw,1,alpha);const a=Math.atan2(ey-y1,ex-x1);g.save();g.globalAlpha=alpha;g.fillStyle=col;g.beginPath();g.moveTo(ex+Math.cos(a)*4,ey+Math.sin(a)*4);g.lineTo(ex-hode*Math.cos(a-0.45),ey-hode*Math.sin(a-0.45));g.lineTo(ex-hode*Math.cos(a+0.45),ey-hode*Math.sin(a+0.45));g.closePath();g.fill();g.restore()}
function stempel(s,x,y,col,t0,t1,sz=34){const a=vis(t0,t1);if(a<=0)return;const sc=pop(t0);g.save();g.translate(x,y);g.rotate(-0.06);g.scale(sc,sc);g.globalAlpha=a;g.font=`${sz}px Mont`;g.font=`900 ${sz}px Mont`;const w=g.measureText(s).width;g.strokeStyle=col;g.lineWidth=4;g.shadowColor=col;g.shadowBlur=12;rr(-w/2-18,-sz*0.95,w+36,sz*1.45,10);g.stroke();g.shadowBlur=0;g.fillStyle=col;g.textAlign='center';g.fillText(s,0,sz*0.18);g.restore()}
function matrise(rader,x,y,sz,col,alpha,cw=110,rh=null){if(alpha<=0)return;rh=rh||sz*1.25;const n=rader.length,m=rader[0].length;const W=cw*m,H=rh*n;g.save();g.globalAlpha=alpha;g.strokeStyle=col;g.lineWidth=3.5;g.lineCap='round';
 g.beginPath();g.moveTo(x+14,y-sz);g.lineTo(x,y-sz);g.lineTo(x,y-sz+H+10);g.lineTo(x+14,y-sz+H+10);g.stroke();g.beginPath();g.moveTo(x+W+16,y-sz);g.lineTo(x+W+30,y-sz);g.lineTo(x+W+30,y-sz+H+10);g.lineTo(x+W+16,y-sz+H+10);g.stroke();g.restore();
 for(let i=0;i<n;i++)for(let j=0;j<m;j++){const c=rader[i][j];if(c==null)continue;const [s,cc,aa]=Array.isArray(c)?c:[c,col,1];tx(s,x+15+cw*j+cw/2,y+i*rh+rh*0.12,sz,cc,alpha*(aa??1),1,'center')}}

// ---- kartet øverst til venstre
function kart(lys,alpha){if(alpha<=0)return;const noder=[['PDE',60],['type',190],['betingelser',330]];g.save();g.globalAlpha=alpha*0.9;
 for(let i=0;i<noder.length;i++){const [s,x]=noder[i];const on=s===lys;g.font=`28px ${F}`;const w=g.measureText(s).width;g.globalAlpha=alpha*(on?1:0.38);g.strokeStyle=on?ORANSJE:GRA;g.lineWidth=on?3:2;if(on){g.shadowColor=ORANSJE;g.shadowBlur=12}rr(x,34,w+24,44,10);g.stroke();g.shadowBlur=0;g.fillStyle=on?ORANSJE:KRITT;g.fillText(s,x+12,65);
  if(i<noder.length-1){g.globalAlpha=alpha*0.38;pil(x+w+30,56,noder[i+1][1]-6,56,GRA,2,1,1,9)}}g.restore()}

// ---- små pilpar for egenverdier
function pilpar(x,y,type,alpha,sk=1){if(alpha<=0)return;const L=48*sk;const a1=-0.5;
 pil(x,y,x+L*Math.cos(a1),y+L*Math.sin(a1),GRONN,4,1,alpha,11);
 if(type==='like')pil(x,y,x+L*Math.cos(a1+Math.PI/2)*0.75,y+L*Math.sin(a1+Math.PI/2)*0.75,GRONN,4,1,alpha,11);
 if(type==='null'){g.save();g.globalAlpha=alpha;g.fillStyle=KRITT;g.beginPath();g.arc(x,y,5,0,7);g.fill();g.restore()}
 if(type==='mot')pil(x,y,x+L*Math.cos(a1+Math.PI/2)*0.75,y+L*Math.sin(a1+Math.PI/2)*0.75,ROD,4,1,alpha,11)}

// ---- fargeskala kald→varm
function varmefarge(v){v=kl(v);const r=Math.round(40+215*v),gg=Math.round(90+60*Math.sin(Math.PI*v)),b=Math.round(230-200*v);return `rgb(${r},${gg},${b})`}
// stasjonær plate med varm venstrekant (Laplace), forhåndsberegnet
const PLATE=(()=>{const N=40,u=[];for(let i=0;i<N;i++){u.push([]);for(let j=0;j<N;j++){const x=(j+0.5)/N,y=(i+0.5)/N;let s=0;for(let k=1;k<40;k+=2)s+=4/(Math.PI*k)*Math.sin(k*Math.PI*y)*Math.sinh(k*Math.PI*(1-x))/Math.sinh(k*Math.PI);u[i].push(s)}}return u})();


// ================= TEGNEHJELP =================
function kopp(x,y,s,a,t){if(a<=0)return;g.save();g.globalAlpha=a;g.translate(x,y);g.scale(s,s);g.strokeStyle=KRITT;g.lineWidth=5;g.lineCap='round';
 g.beginPath();g.moveTo(-60,-50);g.lineTo(-50,60);g.quadraticCurveTo(0,80,50,60);g.lineTo(60,-50);g.stroke();
 g.beginPath();g.ellipse(0,-50,60,14,0,0,7);g.stroke();g.beginPath();g.arc(75,0,26,-1.2,1.2);g.stroke();
 const damp=Math.max(0,1-t/10);g.strokeStyle=`rgba(236,239,230,${0.7*damp})`;g.lineWidth=4;
 for(let k=-1;k<=1;k++){g.beginPath();for(let j=0;j<=20;j++){const yy=-70-j*5;const xx=k*25+8*Math.sin(j*0.6+t*3+k);j?g.lineTo(xx,yy):g.moveTo(xx,yy)}g.stroke()}g.restore()}
function streng(x0,y0,L,amp,modus,t,col,a,lw=4){if(a<=0)return;g.save();g.globalAlpha=a;g.strokeStyle=col;g.lineWidth=lw;g.lineCap='round';g.beginPath();
 for(let k=0;k<=80;k++){const s=k/80;let u=0;for(const [n,A] of modus)u+=A*Math.sin(n*Math.PI*s)*Math.cos(n*t*5);const X=x0+s*L,Y=y0-u*amp;k?g.lineTo(X,Y):g.moveTo(X,Y)}g.stroke();
 g.fillStyle=KRITT;g.beginPath();g.arc(x0,y0,6,0,7);g.arc(x0+L,y0,6,0,7);g.fill();g.restore()}
function planet(x,y,r,a,t){if(a<=0)return;g.save();g.globalAlpha=a;const gr=g.createRadialGradient(x-r*0.3,y-r*0.3,r*0.2,x,y,r);gr.addColorStop(0,'#4f9fd8');gr.addColorStop(1,'#1d4f7a');g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();
 for(let k=0;k<12;k++){const v=k*Math.PI/6;const f=((t*0.4+k*0.13)%1);pil(x+Math.cos(v)*(r+110-60*f),y+Math.sin(v)*(r+110-60*f),x+Math.cos(v)*(r+40-60*f*0.2),y+Math.sin(v)*(r+40-60*f*0.2),TURKIS,3,1,a*0.8,10)}g.restore()}
function klokke(x,y,r,a,vinkel){if(a<=0)return;g.save();g.globalAlpha=a;g.strokeStyle=KRITT;g.lineWidth=4;g.beginPath();g.arc(x,y,r,0,7);g.stroke();
 for(let k=0;k<12;k++){const v=k*Math.PI/6;strek(x+Math.cos(v)*r*0.82,y+Math.sin(v)*r*0.82,x+Math.cos(v)*r*0.95,y+Math.sin(v)*r*0.95,KRITT,2,1,a)}
 strek(x,y,x+Math.sin(vinkel)*r*0.75,y-Math.cos(vinkel)*r*0.75,ORANSJE,4,1,a);g.restore()}
// varmeprofil på en stav: u(x,t) = sum av gaussere som flater ut
const prof=(xx,tt)=>{const s=0.02+0.08*tt;return Math.sqrt(0.02/s)*Math.exp(-Math.pow(xx-0.5,2)/s)};
function graf(x0,y0,W,H,tt,col,a,lw=4){if(a<=0)return;g.save();g.globalAlpha=a;g.strokeStyle=col;g.lineWidth=lw;g.beginPath();for(let k=0;k<=80;k++){const s=k/80;const X=x0+s*W,Y=y0-prof(s,tt)*H;k?g.lineTo(X,Y):g.moveTo(X,Y)}g.stroke();g.restore()}
function stav(x0,y0,W,h,tt,a){if(a<=0)return;g.save();g.globalAlpha=a;for(let k=0;k<60;k++){const s=(k+0.5)/60;g.fillStyle=varmefarge(prof(s,tt));g.fillRect(x0+k*W/60,y0,W/60+1,h)}g.strokeStyle=KRITT;g.lineWidth=2;g.strokeRect(x0,y0,W,h);g.restore()}
function akser(x0,y0,W,H,xn,yn,a,col=KRITT){pil(x0,y0,x0+W,y0,col,3,1,a,12);pil(x0,y0,x0,y0-H,col,3,1,a,12);tx(xn,x0+W-10,y0+40,32,col,a);tx(yn,x0-36,y0-H+20,32,col,a)}
function hake(x,y,a,col=GRONN){if(a<=0)return;g.save();g.globalAlpha=a;g.strokeStyle=col;g.lineWidth=6;g.lineCap='round';g.beginPath();g.moveTo(x,y);g.lineTo(x+12,y+14);g.lineTo(x+36,y-18);g.stroke();g.restore()}
function kryss(x,y,a){if(a<=0)return;strek(x,y-16,x+30,y+14,ROD,6,1,a);strek(x+30,y-16,x,y+14,ROD,6,1,a)}
function varmeovn(x,y,col,a,t){if(a<=0)return;g.save();g.globalAlpha=a;g.strokeStyle=col;g.lineWidth=4;rr(x-30,y-22,60,44,8);g.stroke();for(let k=-1;k<=1;k++)strek(x+k*16,y-14,x+k*16,y+14,col,3,1,a);g.restore()}

// ================= DELENE =================
function kaldstart(){ // kilde 19.8–70.4 (læreren stor, litt til høyre)
 if(tv>M(119.0))return;
 const boksen=(t0,y,tegn)=>{const a=vis(t0,118.9);if(a<=0)return;const s=pop(t0);g.save();g.translate(220,y+140);g.scale(s,s);g.translate(-220,-y-140);boks(70,y,300,280,KRITT,a*0.6,false);tegn(a);g.restore()};
 boksen(19.9,40,a=>kopp(220,200,1.1,a,tv-M(19.8)));
 boksen(31.3,360,a=>streng(100,500,240,60,[[1,1],[2,0.4]],tv,LILLA,a));
 boksen(54.5,680,a=>planet(220,820,60,a,tv));
 const pd=vis(66.0,118.9);if(pd>0){const s=pop(69.4);g.save();g.translate(620,560);g.scale(s,s);tx('PDE-er',0,0,90,ORANSJE,pd,1,'center');g.restore();
   tx('partielle',620,660,40,ORANSJE,pd,pv(64.0,0.8),'center');tx('differensialligninger',620,715,40,ORANSJE,pd,pv(64.6,1.0),'center')}
}

function del1(){ // 119.5–354.5
 if(tv<M(119.4)||tv>M(384.0))return;
 const ut1=262.0;
 txt('Hva er en PDE?',60,140,60,ORANSJE,119.5,384.0,1.0);
 // ODE
 const oa=vis(119.7,ut1);if(oa>0){akser(100,520,420,260,'t','u',oa);g.save();g.globalAlpha=oa;g.strokeStyle=TURKIS;g.lineWidth=5;g.beginPath();const fr=pv(120.5,1.5);for(let k=0;k<=60*fr;k++){const X=100+k*7,Y=520-40-170*Math.exp(-k/25);k?g.lineTo(X,Y):g.moveTo(X,Y)}g.stroke();g.restore();
   tx('ODE: u(t)',100,600,44,KRITT,oa,pv(119.7,0.8));lapp('én variabel – for eksempel tida',100,660,GRA,123.1,ut1,30)}
 // PDE-flate: u(x, t) i 3D, roterer om u-aksen
 const pa=vis(129.4,ut1);if(pa>0){const cx=900,cy=470;const phi=-0.35+0.9*ease(kl((tv-M(130.0))/8));
   const P=(x,t,u)=>{const X=(x-0.5)*1.0,Y=(t-0.5)*1.0;const xr=X*Math.cos(phi)-Y*Math.sin(phi),yr=X*Math.sin(phi)+Y*Math.cos(phi);return [cx+xr*330,cy-u*190+yr*95]};
   const U=(x,t)=>prof(x,t*2.4);
   g.save();g.globalAlpha=pa;g.lineWidth=2.5;
   for(let j=0;j<=8;j++){const t=j/8;g.strokeStyle=j===0?TURKIS:'rgba(86,215,184,0.55)';g.beginPath();for(let k=0;k<=40;k++){const [X,Y]=P(k/40,t,U(k/40,t));k?g.lineTo(X,Y):g.moveTo(X,Y)}g.stroke()}
   g.strokeStyle='rgba(86,215,184,0.35)';for(let k=0;k<=10;k++){const x=k/10;g.beginPath();for(let j=0;j<=24;j++){const t=j/24;const [X,Y]=P(x,t,U(x,t));j?g.lineTo(X,Y):g.moveTo(X,Y)}g.stroke()}
   g.restore();
   const [ox,oy]=P(0,0,0),[xx,xy]=P(1.15,0,0),[tx2,ty2]=P(0,1.2,0),[ux,uy]=P(0,0,1.3);
   pil(ox,oy,xx,xy,KRITT,3,1,pa,12);pil(ox,oy,tx2,ty2,ORANSJE,3,1,pa,12);pil(ox,oy,ux,uy,TURKIS,3,1,pa,12);
   tx('x',xx+8,xy+10,34,KRITT,pa);tx('t',tx2+8,ty2+10,34,ORANSJE,pa);tx('u',ux-30,uy+10,34,TURKIS,pa);
   tx('PDE: u(x, t)',680,640,44,KRITT,pa,pv(129.4,0.8));lapp('flere variabler på en gang',680,700,GRA,132.5,ut1,30)}
 // værkart over Norge: u(x, y, t) – temperaturen avhenger av hvor og når
 const sa=vis(137.2,ut1);if(sa>0){const ox=800,oy=1045,sk=25;
   const NO=[[5.0,58.9],[5.6,58.0],[7.0,58.0],[8.2,58.1],[9.5,58.9],[10.6,59.3],[11.2,59.0],[11.8,59.9],[12.4,60.5],[12.2,61.6],[12.6,62.0],[12.1,63.3],[13.9,64.5],[14.3,65.1],[16.0,67.0],[18.0,68.5],[20.0,69.0],[21.0,69.8],[23.5,69.0],[25.0,68.6],[26.5,69.9],[28.5,69.0],[30.5,69.8],[31.0,70.4],[28.0,71.1],[25.5,71.1],[23.0,70.8],[19.5,70.2],[17.0,69.4],[15.0,68.3],[13.5,67.6],[12.5,66.4],[12.0,65.0],[10.5,64.4],[9.0,63.5],[7.2,62.9],[5.5,62.3],[4.9,61.5],[5.0,60.5],[5.2,59.5]];
   const proj=([lo,la])=>[ox+(lo-4.5)*sk*0.45,oy-(la-57.8)*sk];
   g.save();g.globalAlpha=sa;g.beginPath();NO.forEach((q,k)=>{const [X,Y]=proj(q);k?g.lineTo(X,Y):g.moveTo(X,Y)});g.closePath();g.save();g.clip();
   const tt=(tv-M(137.2))*0.6;
