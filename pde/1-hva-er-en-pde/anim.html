// ---- tekst med enkel matte-markup: a_{xx}, a^{2}
function tokens(s){const out=[];let i=0;while(i<s.length){const ch=s[i];if((ch==='_'||ch==='^')&&i+1<s.length){let j=i+1,inner;if(s[j]==='{'){const k=s.indexOf('}',j);inner=s.slice(j+1,k);i=k+1}else{inner=s[j];i=j+1}out.push([ch==='_'?'sub':'sup',inner])}else{let j=i;while(j<s.length&&s[j]!=='_'&&s[j]!=='^')j++;out.push(['n',s.slice(i,j)]);i=j}}return out}

// stasjonær plate med varm venstrekant (Laplace), forhåndsberegnet
const PLATE=(()=>{const N=40,u=[];for(let i=0;i<N;i++){u.push([]);for(let j=0;j<N;j++){const x=(j+0.5)/N,y=(i+0.5)/N;let s=0;for(let k=1;k<40;k+=2)s+=4/(Math.PI*k)*Math.sin(k*Math.PI*y)*Math.sinh(k*Math.PI*(1-x))/Math.sinh(k*Math.PI);u[i].push(s)}}return u})();

 for(let k=0;k<=80;k++){const s=k/80;let u=0;for(const [n,A] of modus)u+=A*Math.sin(n*Math.PI*s)*Math.cos(n*t*5);const X=x0+s*L,Y=y0-u*amp;k?g.lineTo(X,Y):g.moveTo(X,Y)}g.stroke();

 for(let k=0;k<12;k++){const v=k*Math.PI/6;const f=((t*0.4+k*0.13)%1);pil(x+Math.cos(v)*(r+110-60*f),y+Math.sin(v)*(r+110-60*f),x+Math.cos(v)*(r+40-60*f*0.2),y+Math.sin(v)*(r+40-60*f*0.2),TURKIS,3,1,a*0.8,10)}g.restore()}

const prof=(xx,tt)=>{const s=0.02+0.08*tt;return Math.sqrt(0.02/s)*Math.exp(-Math.pow(xx-0.5,2)/s)};
function graf(x0,y0,W,H,tt,col,a,lw=4){if(a<=0)return;g.save();g.globalAlpha=a;g.strokeStyle=col;g.lineWidth=lw;g.beginPath();for(let k=0;k<=80;k++){const s=k/80;const X=x0+s*W,Y=y0-prof(s,tt)*H;k?g.lineTo(X,Y):g.moveTo(X,Y)}g.stroke();g.restore()}
