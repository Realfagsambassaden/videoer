<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Hand;src:url(../../_verktoy/ArchitectsDaughter-Norsk.ttf)}
@font-face{font-family:Mont;src:url(../../_verktoy/Montserrat-Black.ttf)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent}
#logo{position:absolute;right:34px;top:150px;height:120px;filter:drop-shadow(0 0 6px #000)}
#fh{position:absolute;left:0;right:0;bottom:120px;text-align:center;font:400 34px Hand;color:#fff;opacity:.85;text-shadow:0 0 6px #000,0 0 3px #000}
#sub{position:absolute;left:60px;right:60px;top:1240px;text-align:center;font:400 82px/1.15 Hand;color:#fff;
  -webkit-text-stroke:10px #0d1110;paint-order:stroke fill;text-shadow:0 6px 18px rgba(0,0,0,.6)}
#sub .na{color:#6ef04a}
.st{position:absolute;left:0;right:0;text-align:center;transform-origin:50% 50%}
.topp{top:330px;left:40px;right:40px;font:900 92px/1.08 Mont;color:#fff;-webkit-text-stroke:12px #0d1110;paint-order:stroke fill}
.midt{top:820px;left:30px;right:30px;font:900 132px/1 Mont;color:#f19c2c;-webkit-text-stroke:14px #0d1110;paint-order:stroke fill}
.emoji{top:560px;font:400 190px/1 sans-serif}
.forklar,.forklar2{font:400 54px/1.5 Hand;color:#0d1110;left:50px;right:50px}
.forklar span,.forklar2 span{display:inline-block;max-width:880px;background:#6ef04a;padding:10px 26px;border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.45);-webkit-box-decoration-break:clone}
.forklar{top:1330px}.forklar2{top:1590px}.forklar2 span{background:#eee462}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#slutt{position:absolute;inset:0;background:#000;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#slutt .u{font:900 110px Mont;color:#6ef04a;text-shadow:0 0 30px rgba(110,240,74,.7)}
#slutt .o{font:400 54px Hand;color:#fff;margin-bottom:30px}
#slutt img{height:300px;margin-bottom:60px}
</style></head><body>
<div id="flash"></div>
<img id="logo" src="../../_verktoy/drnormann-logo.svg">
<div id="fh">fysikkhjelp.no</div>
<div id="sub"></div>
<div id="lag"></div>
<div id="slutt"><img src="../../_verktoy/drnormann-logo.svg"><div class="o">Mer fysikk på</div><div class="u">fysikkhjelp.no</div></div>
<script>
let D = null; const klemt = x => Math.max(0, Math.min(1, x));
window.init = d => { D = d; const L = document.getElementById('lag');
  D.el = D.stempler.map(([t, v, tx, stil]) => { const e = document.createElement('div'); e.className = 'st ' + stil;
    e.innerHTML = stil.startsWith('forklar') ? `<span>${tx}</span>` : tx; L.appendChild(e); return e; }); };
window.render = t => {
  // teksting: ord for ord, ordet som sies er grønt
  const s = document.getElementById('sub'); let h = '';
  for (const [t0, t1, tx] of D.tekst) if (t >= t0 && t < t1 + 0.15) {
    const ord = tx.split(' '), tot = ord.reduce((a, w) => a + w.length + 1, 0); let acc = 0, aktiv = -1;
    ord.forEach((w, i) => { const a = t0 + (t1 - t0) * acc / tot; if (t >= a) aktiv = i; acc += w.length + 1; });
    // vis biter på høyst 4 ord rundt ordet som sies
    const b0 = Math.floor(Math.max(aktiv, 0) / 4) * 4;
    h = ord.slice(b0, b0 + 4).map((w, i) => i + b0 === aktiv ? `<span class="na">${w}</span>` : w).join(' ');
  }
  s.innerHTML = h;
  D.stempler.forEach(([t0, v, tx, stil], i) => { const e = D.el[i], x = t - t0;
    if (x < 0 || x > v) { e.style.opacity = 0; return; }
    const inn = klemt(x / 0.18), ut = klemt((v - x) / 0.25);
    const sk = inn < 1 ? 2.0 - inn : 1 + 0.04 * Math.sin(x * 10);
    e.style.opacity = Math.min(inn * 2, ut); e.style.transform = `scale(${sk}) rotate(${stil === 'midt' ? -6 : stil === 'emoji' ? 8 * Math.sin(x * 6) : 0}deg)`; });
  // hvitt blink ved kutt (bare de første)
  let fl = 0; for (const k of D.kutt.slice(1)) { const x = t - k; if (x >= 0 && x < 0.15) fl = 0.55 * (1 - x / 0.15); }
  document.getElementById('flash').style.opacity = fl;
  const sl = klemt((t - D.slutt) / 0.35); document.getElementById('slutt').style.opacity = sl;
  document.getElementById('slutt').style.transform = `scale(${1.15 - 0.15 * sl})`;
  document.getElementById('logo').style.opacity = 1 - sl; document.getElementById('fh').style.opacity = 0.85 * (1 - sl);
};
</script></body></html>
