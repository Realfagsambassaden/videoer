<script>
// ---------- hjelpere ----------
const L = document.getElementById('lag');
const E = [];   // alle elementer: {el, inn, ut, type, ...}
const lerp = (a, b, x) => a + (b - a) * x, klemt = x => Math.max(0, Math.min(1, x));
const glatt = x => { x = klemt(x); return x * x * (3 - 2 * x); };
function lag(html, x, y, inn, ut, type = 'fade', ekstra = {}) {
  const d = document.createElement('div'); d.className = 'a ' + (ekstra.cls || ''); d.innerHTML = html;
  d.style.left = x + 'px'; d.style.top = y + 'px'; if (ekstra.w) { d.style.width = ekstra.w + 'px'; d.style.whiteSpace = 'normal'; }
  if (ekstra.css) d.style.cssText += ekstra.css;
  L.appendChild(d); const o = Object.assign({ el: d, inn, ut, type, varighet: 0.6 }, ekstra); E.push(o); return o;
}
// Tekst som «skrives»: avsløres fra venstre i løpet av varighet sekunder
const skriv = (html, x, y, inn, ut, cls, varighet, ekstra = {}) => lag(html, x, y, inn, ut, 'skriv', Object.assign({ cls, varighet: varighet || 1.2 }, ekstra));
// Lærerens tegning (SVG) – strekene tegnes fram i rekkefølge, gruppert etter et filter
function tegning(id, x, y, bredde, inn, ut, grupper) {
  const mal = document.getElementById('svg-' + id); const s = mal.content.firstElementChild.cloneNode(true);
  const vb = s.getAttribute('viewBox').split(' ').map(Number); s.setAttribute('class', 'tegn');
  s.style.left = x + 'px'; s.style.top = y + 'px'; s.style.width = bredde + 'px'; s.style.height = (bredde * vb[3] / vb[2]) + 'px';
  s.querySelectorAll('path.s').forEach(p => { const w = parseFloat(p.getAttribute('stroke-width') || 1); p.setAttribute('stroke-width', Math.max(w * 1.35, 1.7)); });
  L.appendChild(s);
  const stier = [...s.querySelectorAll('path')];
  const o = { el: s, inn, ut, type: 'tegning', grupper: (grupper || [{ fra: inn, til: inn + 2, velg: () => true }]).map(g => ({ ...g, stier: stier.filter(p => g.velg(+p.dataset.x, +p.dataset.y, p)) })) };
  E.push(o); return o;
}
function sti(d, farge, bredde, inn, varighet, ut, ekstra = {}) {   // egen strek (chalk), tegnes fram
  const ns = 'http://www.w3.org/2000/svg', s = document.createElementNS(ns, 'svg');
  s.setAttribute('width', 1920); s.setAttribute('height', 1080); s.style.cssText = 'position:absolute;left:0;top:0;opacity:0;pointer-events:none';
  const p = document.createElementNS(ns, 'path'); p.setAttribute('d', d); p.setAttribute('pathLength', 1);
  p.setAttribute('stroke', farge); p.setAttribute('stroke-width', bredde); p.setAttribute('fill', ekstra.fyll || 'none');
  p.setAttribute('stroke-linecap', 'round'); p.setAttribute('stroke-linejoin', 'round'); p.style.strokeDasharray = '1 1';
  if (ekstra.strek) p.setAttribute('stroke-dasharray', ekstra.strek);
  s.appendChild(p); L.appendChild(s);
  const o = { el: s, p, inn, ut, type: 'sti', varighet, ...ekstra }; E.push(o); return o;
}
const pil = (x1, y1, x2, y2, farge, b, inn, v, ut) => {   // pil som strek med pilhode
  const a = Math.atan2(y2 - y1, x2 - x1), k = 22;
  const d = `M${x1} ${y1} L${x2} ${y2} M${x2 - k * Math.cos(a - .45)} ${y2 - k * Math.sin(a - .45)} L${x2} ${y2} L${x2 - k * Math.cos(a + .45)} ${y2 - k * Math.sin(a + .45)}`;
  return sti(d, farge, b, inn, v, ut);
};

// ---------- tidslinje ----------
const KALD = 14.5, TITTEL = 2.6, HOVED = 227.82, DASH = 5.5;
const M = T => T + TITTEL;               // tid i opptaket → tid i animasjonen
const SLUTT = KALD + TITTEL + HOVED + DASH;
window.S = [['kald', KALD], ['tittel', TITTEL], ['hoved', HOVED], ['dashman', DASH]];
const START = [0, KALD, KALD + TITTEL, KALD + TITTEL + HOVED];
const SEKSJON = [M(60.53), M(98.63), M(149.92), M(203.06)];   // viskelær-overganger

// --- Kald start: bak kulissene ---
lag('<span class="rec">● REC</span>', 90, 70, 0.2, KALD, 'blink');

// --- Tittelkort ---
lag('<img src="../../_verktoy/fh-logo-linje.png" style="height:70px">', 90, 80, KALD, KALD + TITTEL, 'fade');

skriv('POTENSIELL ENERGI', 150, 430, KALD + 0.25, KALD + TITTEL, 'h1', 1.1, { css: 'font-size:150px' });
sti('M160 620 C600 600 1100 640 1640 612', '#f19c2c', 8, KALD + 0.9, 0.8, KALD + TITTEL);

// --- A: Hva er potensiell energi? (T 14.5–60.5) ---
const A0 = M(14.5), A1 = SEKSJON[0];
skriv('POTENSIELL ENERGI', 90, 60, A0 + 0.1, A1, 'h1', 1.2);
sti('M90 160 C350 152 600 165 860 156', '#f19c2c', 5, A0 + 1.1, 0.6, A1);
skriv('Arbeid er overføring av energi', 90, 205, M(15.3), A1, 't', 2.4);
// koppen løftes (T 19.3–29.3)
lag(`<svg width="200" height="190" viewBox="0 0 200 190"><path d="M40 30 L52 170 Q100 182 148 170 L160 30 Z" fill="none" stroke="#ecefe6" stroke-width="6" stroke-linejoin="round"/>
  <path d="M160 62 C205 62 205 132 154 132" fill="none" stroke="#ecefe6" stroke-width="6"/><path d="M70 75 q12 -10 24 0 q12 10 24 0" fill="none" stroke="#56d7b8" stroke-width="5"/></svg>`,
  880, 700, M(19.6), M(40.0), 'kopp', { fra: M(20.4), til: M(23.4), y0: 700, y1: 330 });
pil(830, 890, 830, 560, '#f19c2c', 7, M(21.0), 1.6, M(40.0));
skriv('arbeid', 690, 690, M(22.6), M(40.0), 't', 0.8, { css: 'color:#f19c2c' });
skriv('Energien er ikke borte …', 90, 330, M(33.0), M(40.0), 't', 1.6);
skriv('… den ligger lagret og venter', 90, 410, M(37.8), M(40.0), 't', 1.6, { css: 'color:#56d7b8' });
// definisjonsboks
lag('', 70, 300, M(40.3), A1, 'boks', { cls: 'boks gronnboks', w: 1160, css: 'height:330px' });
skriv('POTENSIELL ENERGI', 104, 322, M(40.6), A1, 'tl', 1.2, { css: 'color:#6ef04a;letter-spacing:.08em' });
skriv('er energi som ligger lagret i et system,', 104, 395, M(45.4), A1, 't', 2.0);
skriv('og som potensielt kan utløses.', 104, 470, M(48.4), A1, 't', 2.0);
lag('<span class="pop" style="font-size:74px">good catch!</span>', 940, 150, M(51.6), M(54.4), 'stempel', { rot: -8 });
skriv('slipper → lagret energi blir til <span style="color:#6ef04a">bevegelsesenergi</span>', 90, 680, M(54.6), A1, 'tl', 2.4);
skriv('To eksempler:', 90, 790, M(58.8), A1, 't', 0.8, { css: 'color:#eee462' });
skriv('1. spiralfjær &nbsp;&nbsp; 2. tyngdefeltet', 420, 790, M(59.5), A1, 't', 1.0);

// --- B: Eks 1, spiralfjær (T 60.5–98.6) ---
const B0 = SEKSJON[0], B1 = SEKSJON[1];
skriv('EKS 1: ENERGI I SPIRALFJÆR', 90, 60, B0 + 0.2, B1, 'h2', 1.3);
sti('M90 145 q20 -10 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0', '#eee462', 4, B0 + 1.2, 0.8, B1);
tegning('fjaer', 70, 200, 800, M(61.6), B1, [
  { fra: M(61.6), til: M(63.4), velg: (x, y) => y < 75 },
  { fra: M(64.0), til: M(66.2), velg: (x, y) => y >= 75 && y < 120 },
  { fra: M(66.6), til: M(68.6), velg: (x, y) => y >= 120 && y < 150 },
  { fra: M(69.0), til: M(71.4), velg: (x, y) => y >= 150 },
]);
lag('<span class="pop">SPJONG!</span>', 880, 600, M(72.3), M(74.4), 'stempel', { rot: 6 });
lag('', 900, 200, M(81.0), B1, 'boks', { cls: 'boks graaboks', w: 360, css: 'height:190px' });
skriv('HOOKES LOV', 930, 220, M(81.3), B1, 'tl', 0.9, { css: 'letter-spacing:.08em' });
skriv('<span class="v">F</span> = −k<span class="v">x</span>', 950, 280, M(83.9), B1, 'f', 1.4);
skriv('k = fjærkonstanten', 900, 420, M(89.2), B1, 'tl', 1.2, { css: 'color:#56d7b8' });
sti('M1046 316 C1018 300 1016 352 1048 352 C1082 352 1080 300 1046 316', '#eee462', 4, M(92.3), 0.7, B1);
skriv('minus: kraften virker mot likevekt', 870, 900, M(93.0), B1, 'tl', 2.2, { css: 'color:#eee462;font-size:36px', w: 420 });

// --- C: Arbeidet er arealet (T 98.6–149.9) ---
const C0 = SEKSJON[1], C1 = SEKSJON[2];
skriv('EKS 1: ENERGI I SPIRALFJÆR', 90, 60, C0, C1, 'h2', 0.01);
sti('M90 145 q20 -10 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0', '#eee462', 4, C0, 0.01, C1);
// graf: akser og linje først, så punktene og stiplede linjer
const gx = 80, gy = 210, gb = 640, gsk = gb / 170;   // graf1: viewBox 262 95 170 173
lag(`<svg width="${gb}" height="${173 * gsk}" viewBox="262 95 170 173"><polygon id="trekant" points="281,256 368,256 368,155" fill="rgba(236,239,230,.32)"/></svg>`, gx, gy, M(109.2), C1, 'wipe', { varighet: 1.6 });
tegning('graf1', gx, gy, gb, M(99.4), C1, [
  { fra: M(99.4), til: M(101.0), velg: (x, y, p) => p.getAttribute('stroke') && p.getAttribute('stroke').startsWith('rgb(100%, 99') },
  { fra: M(103.6), til: M(105.4), velg: (x, y, p) => p.getAttribute('stroke') && p.getAttribute('stroke').startsWith('rgb(49') },
  { fra: M(106.7), til: M(108.6), velg: (x, y, p) => !(p.getAttribute('stroke') || '').startsWith('rgb(100%, 99') && !(p.getAttribute('stroke') || '').startsWith('rgb(49') },
]);
skriv('arbeid brukt på å', 790, 250, M(109.6), C1, 't', 1.0);
skriv('presse sammen fjæra', 790, 312, M(110.6), C1, 't', 1.2);
pil(770, 420, 560, 520, '#ecefe6', 4, M(110.2), 0.8, C1);
skriv('= arealet under grafen', 790, 374, M(112.0), C1, 'tl', 1.0, { css: 'color:#9aa49e' });
skriv('trekant: ½ · x · kx', 790, 470, M(122.3), C1, 't', 1.4, { css: 'color:#56d7b8' });
skriv('W = ∫ <span class="v">F</span> · d<span class="v">x</span> = ∫ kx dx', 790, 560, M(126.3), C1, 'f', 2.0, { css: 'font-size:50px' });
skriv('= ½ kx² + W<sub>0</sub>', 840, 640, M(129.2), C1, 'f', 1.6, { css: 'font-size:50px' });
skriv('W<sub>0</sub> = 0', 1010, 700, M(131.8), C1, 'tl', 0.8, { css: 'color:#eee462' });
skriv('arbeidet forsvinner ikke – det ligger lagret i fjæra', 80, 940, M(134.4), C1, 'tl', 2.6);
lag('', 790, 770, M(139.6), C1, 'boks', { cls: 'boks gronnboks', w: 460, css: 'height:140px' });
skriv('POTENSIELL ENERGI I SPIRALFJÆR', 810, 782, M(139.8), C1, 'tl', 1.2, { css: 'color:#6ef04a;font-size:28px;letter-spacing:.06em' });
skriv('E<sub>p</sub> = ½ kx²', 860, 826, M(140.6), C1, 'f', 1.0, { css: 'font-size:62px' });
lag('<span class="pop">SPJONG!</span>', 300, 700, M(143.4), M(145.6), 'stempel', { rot: -6 });
skriv('→ bevegelsesenergi', 80, 1005, M(146.0), C1, 'tl', 1.4, { css: 'color:#6ef04a' });

// --- D: Eks 2, tyngdefeltet (T 149.9–203) ---
const D0 = SEKSJON[2], D1 = SEKSJON[3];
skriv('EKS 2: ENERGI I TYNGDEFELTET', 90, 60, D0 + 0.2, D1, 'h2', 1.3);
sti('M90 145 q20 -10 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0', '#eee462', 4, D0 + 1.2, 0.8, D1);
// ballen løftes fra bakken til høyden h (x 900–1240)
sti('M760 900 L1100 900', '#ecefe6', 4, M(152.0), 0.8, D1);
lag('<svg width="120" height="120"><circle cx="60" cy="60" r="52" fill="none" stroke="#ecefe6" stroke-width="5"/></svg>', 820, 778, M(152.4), D1, 'ball', { fra: M(155.0), til: M(161.0), y0: 778, y1: 330 });
lag('<svg width="120" height="120"><circle cx="60" cy="60" r="52" fill="none" stroke="#9aa49e" stroke-width="3" stroke-dasharray="8 9"/></svg>', 820, 778, M(161.0), D1, 'fade');
pil(880, 470, 880, 600, '#6ef04a', 7, M(166.4), 0.8, D1);   // G ned
skriv('<span class="v">G</span>', 896, 560, M(166.8), D1, 't', 0.4, { css: 'color:#6ef04a' });
pil(880, 320, 880, 200, '#6ef04a', 7, M(163.2), 0.8, D1);   // F opp
skriv('<span class="v">F</span>', 896, 196, M(163.6), D1, 't', 0.4, { css: 'color:#6ef04a' });
pil(1020, 898, 1020, 392, '#f19c2c', 7, M(185.6), 1.0, D1);   // h
skriv('h', 1038, 600, M(186.3), D1, 't', 0.4, { css: 'color:#f19c2c' });
skriv('konstant fart ⇒ F = G', 90, 180, M(160.0), D1, 't', 1.8, { css: 'color:#56d7b8' });
lag('', 80, 240, M(169.2), D1, 'boks', { cls: 'boks graaboks', w: 400, css: 'height:150px' });
skriv('TYNGDEKRAFT', 108, 252, M(169.4), D1, 'tl', 0.8, { css: 'letter-spacing:.08em' });
skriv('<span class="v">G</span> = m<span class="v" style="font-family:Comic">g</span>', 130, 306, M(170.0), D1, 'f', 1.0);
// graf med konstant kraft
sti('M120 860 L120 480 M108 500 L120 480 L132 500 M120 860 L680 860 M660 848 L680 860 L660 872', '#eee462', 4, M(174.4), 1.2, D1);
skriv('F', 140, 450, M(174.6), D1, 't', 0.3, { css: 'color:#eee462' });
skriv('x', 690, 840, M(175.0), D1, 't', 0.3, { css: 'color:#eee462' });
sti('M120 560 L560 560', '#6ef04a', 5, M(178.4), 0.9, D1);
sti('M560 560 L560 860', '#56d7b8', 3, M(179.0), 0.5, D1, { strek: '0.02 0.02' });
lag('<div style="width:440px;height:300px;background:rgba(236,239,230,.32)"></div>', 120, 560, M(179.4), D1, 'wipe', { varighet: 1.4 });
skriv('mg', 60, 535, M(180.2), D1, 'tl', 0.4, { css: 'color:#6ef04a' });
skriv('h', 548, 870, M(186.4), D1, 'tl', 0.4, { css: 'color:#f19c2c' });
skriv('W = ∫ F dx = F · h', 120, 920, M(177.2), D1, 'f', 1.8, { css: 'font-size:50px' });
skriv('= mg · h', 575, 920, M(183.0), D1, 'f', 1.2, { css: 'font-size:50px' });
lag('', 760, 950, M(194.8), D1, 'boks', { cls: 'boks gronnboks', w: 360, css: 'height:100px;padding:6px 24px' });
skriv('E<sub>p</sub> = mgh', 800, 956, M(195.2), D1, 'f', 1.0, { css: 'font-size:62px' });

// --- E: Oppsummering (T 203–242.3) ---
const E0 = SEKSJON[3], E1 = START[3];
skriv('FELLES FOR BEGGE', 90, 60, E0 + 0.2, E1, 'h1', 1.2, { css: 'font-size:72px' });
lag('', 90, 200, M(201.5), E1, 'boks', { cls: 'boks gronnboks', w: 520, css: 'height:170px' });
skriv('SPIRALFJÆR', 120, 214, M(201.7), E1, 'tl', 0.7, { css: 'color:#6ef04a' });
skriv('E<sub>p</sub> = ½ kx²', 130, 270, M(202.0), E1, 'f', 0.8);
lag('', 690, 200, M(202.4), E1, 'boks', { cls: 'boks gronnboks', w: 520, css: 'height:170px' });
skriv('TYNGDEFELTET', 720, 214, M(202.6), E1, 'tl', 0.7, { css: 'color:#6ef04a' });
skriv('E<sub>p</sub> = mgh', 730, 270, M(202.9), E1, 'f', 0.8);
skriv('arbeid mot en kraft', 90, 460, M(203.3), E1, 't', 1.6);
pil(560, 492, 700, 492, '#f19c2c', 5, M(206.4), 0.5, E1);
skriv('lagret som <span style="color:#f19c2c">potensiell energi</span>', 730, 460, M(206.6), E1, 't', 2.0, { w: 560 });
skriv('… som kan hentes ut igjen', 90, 560, M(212.4), E1, 't', 1.8, { css: 'color:#56d7b8' });
skriv('potensiell energi', 90, 740, M(229.6), E1, 't', 1.2, { css: 'color:#f19c2c' });
pil(480, 772, 620, 772, '#ecefe6', 5, M(230.6), 0.5, E1);
skriv('bevegelsesenergi', 650, 740, M(230.8), E1, 't', 1.4, { css: 'color:#6ef04a' });
skriv('= kinetisk energi', 650, 815, M(238.2), E1, 'tl', 1.2, { css: 'color:#eee462' });
lag('<img src="../../_verktoy/fh-logo-linje.png" style="height:60px">', 90, 960, M(240.6), E1, 'fade');
skriv('Takk for meg!', 520, 950, M(241.2), E1, 't', 0.8, { css: 'color:#ecefe6' });

// --- Dashman-tegneserie ---
const D = START[3];
lag('', 90, 200, D, SLUTT, 'panel', { cls: 'panel', css: 'width:520px;height:620px' });
lag('', 700, 200, D + 1.0, SLUTT, 'panel', { cls: 'panel', css: 'width:520px;height:620px' });
lag('', 1310, 200, D + 2.1, SLUTT, 'panel', { cls: 'panel', css: 'width:520px;height:620px' });
tegning('dash1', 190, 260, 300, D + 0.15, SLUTT, [{ fra: D + 0.15, til: D + 0.9, velg: () => true }]);
lag('<span class="pop" style="font-size:80px">?</span>', 470, 260, D + 0.7, SLUTT, 'stempel', { rot: 10 });
tegning('dash2', 740, 300, 440, D + 1.15, SLUTT, [{ fra: D + 1.15, til: D + 1.9, velg: () => true }]);
skriv('nnnggh …', 760, 720, D + 1.6, SLUTT, 't', 0.6, { css: 'color:#eee462' });
tegning('dash3', 1340, 330, 460, D + 2.25, SLUTT, [{ fra: D + 2.25, til: D + 2.7, velg: () => true }]);
lag('<span class="pop" style="font-size:110px">SPJONG!</span>', 1370, 230, D + 2.75, SLUTT, 'stempel', { rot: -8 });
lag('', 0, 0, D + 2.8, SLUTT, 'flyr', {});

// ---------- tegning av et bilde ----------
const sone = document.getElementById('sone');
const OVERGANG = SEKSJON.concat([START[3]]);
function viskX(G) {   // viskelærets midtpunkt (px) hvis en overgang pågår, ellers null
  for (const s of OVERGANG) { const k = (G - (s - 0.45)) / 0.9; if (k >= 0 && k <= 1) return { x: lerp(-300, 2220, k), s }; }
  return null;
}
window.render = function (n, t) {
  const G = START[n] + t, V = viskX(G);
  for (const o of E) {
    // innhold fra seksjonen som slutter, viskes bort av viskelæret (vises til venstre for det, fram til det er passert)
    const slutterHer = V && Math.abs(o.ut - V.s) < 0.02;
    const synlig = G >= o.inn && (G < o.ut || (slutterHer && G < o.ut + 0.45));
    const venstre = parseFloat(o.el.style.left) || 0;
    const kutt = slutterHer ? Math.max(0, V.x - 160 - venstre) : 0;   // px skjult fra venstre
    let hoyre = 0;
    if (o.type === 'tegning') {
      o.el.style.opacity = synlig ? 1 : 0;
      if (!synlig) continue;
      for (const g of o.grupper) {
        const n2 = g.stier.length;
        g.stier.forEach((p, i) => {
          const a = g.fra + (g.til - g.fra) * i / n2, b = g.fra + (g.til - g.fra) * (i + 1) / n2;
          const x = klemt((G - a) / Math.max(b - a, 1e-3));
          if (p.classList.contains('s')) p.style.strokeDashoffset = 1 - x; else p.style.opacity = x;
        });
      }
      if (o.inn >= START[3] + 2) {   // Dashman flyr ut av bildet
        const fx = klemt((G - (START[3] + 2.85)) / 0.9);
        if (!o.fly) { const ns = 'http://www.w3.org/2000/svg'; o.fly = document.createElementNS(ns, 'g'); o.el.appendChild(o.fly);
          [...o.el.querySelectorAll('path')].filter(p => +p.dataset.x < 450).forEach(p => o.fly.appendChild(p)); }
        o.fly.setAttribute('transform', `translate(${-fx * 160} ${-fx * 200}) rotate(${-fx * 360} 395 255)`); o.el.style.overflow = 'hidden';
      }
      o.el.style.clipPath = kutt ? `inset(-50% -50% -50% ${kutt}px)` : '';
      continue;
    }
    if (o.type === 'sti') {
      o.el.style.opacity = synlig ? 1 : 0;
      o.p.style.strokeDashoffset = 1 - klemt((G - o.inn) / o.varighet);
      if (o.strek) { o.p.style.strokeDasharray = ''; o.el.style.opacity = synlig ? klemt((G - o.inn) / o.varighet) : 0; }
      o.el.style.clipPath = kutt ? `inset(0 0 0 ${kutt}px)` : '';
      continue;
    }
    const el = o.el; el.style.opacity = synlig ? 1 : 0; if (!synlig) continue;
    const x = (G - o.inn) / o.varighet;
    el.style.transform = '';
    if (o.type === 'skriv' || o.type === 'wipe') hoyre = 100 - 100 * glatt(x);
    else if (o.type === 'fade' || o.type === 'panel') el.style.opacity = glatt((G - o.inn) / 0.4);
    else if (o.type === 'boks') { el.style.opacity = glatt((G - o.inn) / 0.35); el.style.transform = `scale(${lerp(0.94, 1, glatt((G - o.inn) / 0.35))})`; }
    else if (o.type === 'blink') el.style.opacity = Math.floor(G * 1.6) % 2 ? 0.25 : 1;
    else if (o.type === 'stempel') { const k = klemt((G - o.inn) / 0.22); const sk = k < 1 ? lerp(2.2, 1, glatt(k)) : 1 + 0.03 * Math.sin((G - o.inn) * 9); el.style.transform = `rotate(${o.rot || 0}deg) scale(${sk})`; el.style.opacity = Math.min(k * 2, 1, klemt((o.ut - G) / 0.25)); }
    else if (o.type === 'kopp' || o.type === 'ball') { const k = glatt((G - o.fra) / (o.til - o.fra)); el.style.top = lerp(o.y0, o.y1, k) + 'px'; el.style.opacity = glatt((G - o.inn) / 0.4); }
    el.style.clipPath = (hoyre || kutt) ? `inset(-30% ${hoyre}% -30% ${kutt ? kutt + 'px' : '-2%'})` : '';
  }
  const vk = document.getElementById('viskelaer');
  if (V) { vk.style.display = 'block'; vk.style.left = (V.x - 260) + 'px'; vk.style.transform = 'skewX(-12deg)'; } else vk.style.display = 'none';
  sone.style.display = window.VIS_SONE ? 'block' : 'none';
};
window.VIS_SONE = false;
document.getElementById('sone').style.display = 'none';
</script>
</body></html>
